name: iOS unsigned IPA

# Builds an unsigned .ipa on a macOS runner. Sign it with a free Apple ID
# (for example with iLoader) to install it on a device for 7 days.
on:
  workflow_dispatch:
  push:
    tags:
      - "ios-*"

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Intel image: the arm64 macOS pool is frequently capacity-constrained.
    runs-on: macos-15-intel
    timeout-minutes: 90
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Patch expo-modules-jsi for Swift concurrency compatibility
        run: |
          python3 - <<'PY'
          import pathlib
          
          # 1. Patch Package.swift:
          # Keep Swift 6 mode (swiftLanguageModes: [.v6]) so ABI and symbol mangling match prebuilt frameworks (ExpoFileSystem, etc.).
          # Remove invalid -Werror flags on Xcode 26.
          pkg_file = pathlib.Path("node_modules/expo-modules-jsi/apple/Package.swift")
          if pkg_file.exists():
              s = pkg_file.read_text()
              s = s.replace('"-Werror", "ImplicitStrongCapture",', '// "-Werror", "ImplicitStrongCapture",')
              s = s.replace('"-Werror", "NoUsage",', '// "-Werror", "NoUsage",')
              pkg_file.write_text(s)
              print("Package.swift patched successfully")

          # 2. Fix the data race closure capture in JavaScriptObject.swift for Swift 6 compiler
          swift_file = pathlib.Path("node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptObject.swift")
          if swift_file.exists():
              s = swift_file.read_text()
              target_code = "try JavaScriptActor.assumeIsolated {"
              replacement_code = "try JavaScriptActor.assumeIsolated { [slot] in"
              if target_code in s:
                  s = s.replace(target_code, replacement_code, 1)
                  swift_file.write_text(s)
                  print("JavaScriptObject.swift patched")

          # 3. Fix nonisolated init of LongLivedState in JavaScriptPromise.swift
          promise_file = pathlib.Path("node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptPromise.swift")
          if promise_file.exists():
              s = promise_file.read_text()
              target_state = "  private final class LongLivedState: LongLivedObject {"
              replacement_state = "  private final class LongLivedState: LongLivedObject {\n    nonisolated init() {}"
              if target_state in s:
                  s = s.replace(target_state, replacement_state, 1)
                  promise_file.write_text(s)
                  print("JavaScriptPromise.swift patched")

          # 4. Fix non-Sendable stored properties warnings-as-errors in Swift 6 mode
          hf_file = pathlib.Path("node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Contexts/HostFunctionContext.swift")
          if hf_file.exists():
              s = hf_file.read_text()
              target = "internal final class HostFunctionContext: HostCallbackContext, Sendable {"
              replacement = "internal final class HostFunctionContext: HostCallbackContext, @unchecked Sendable {"
              if target in s:
                  s = s.replace(target, replacement, 1)
                  hf_file.write_text(s)
                  print("HostFunctionContext.swift patched")

          ho_file = pathlib.Path("node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Contexts/HostObjectContext.swift")
          if ho_file.exists():
              s = ho_file.read_text()
              target = "internal final class HostObjectContext: HostCallbackContext, Sendable {"
              replacement = "internal final class HostObjectContext: HostCallbackContext, @unchecked Sendable {"
              if target in s:
                  s = s.replace(target, replacement, 1)
                  ho_file.write_text(s)
                  print("HostObjectContext.swift patched")

          # 5. Remove -quiet from build-xcframework.sh so errors are logged
          sh_file = pathlib.Path("node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh")
          if sh_file.exists():
              s = sh_file.read_text()
              s = s.replace("-quiet \\", "\\")
              sh_file.write_text(s)
              print("build-xcframework.sh patched")
          PY

      - name: Generate the Xcode project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: native/ios
        run: pod install

      - name: Build without code signing
        working-directory: native/ios
        run: |
          set -euo pipefail
          workspace=$(ls -d ./*.xcworkspace | head -n1)
          project=$(ls -d ./*.xcodeproj | head -n1)
          project_name="${project##*/}"; project_name="${project_name%.xcodeproj}"
          export PROJECT_NAME="$project_name"
          scheme=$(xcodebuild -list -json -workspace "$workspace" |
            python3 -c 'import json, os, sys; data = json.load(sys.stdin); schemes = (data.get("workspace") or data.get("project"))["schemes"]; target = os.environ["PROJECT_NAME"]; print(next((s for s in schemes if s == target), next((s for s in schemes if "Pods" not in s), schemes[0])))')
          echo "Building $scheme from $workspace"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=off \
            build

      - name: Package the unsigned IPA
        working-directory: native/ios
        run: |
          set -euo pipefail
          app=$(find build -type d -name '*.app' | head -n1)
          if [ -z "$app" ]; then echo "No .app found under build/"; find build -maxdepth 4 -type d -name '*.app' -o -name '*.app' | head; exit 1; fi
          echo "Packaging $app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$app" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload unsigned.ipa
          ls -lh unsigned.ipa

      - name: Upload the unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: native/ios/unsigned.ipa
          if-no-files-found: error
          retention-days: 14
