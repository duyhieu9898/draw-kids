<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3.141 original asset review</title>
<style>body{font:15px system-ui;margin:20px;background:#f4f4f4;color:#222}header{position:sticky;top:0;background:#f4f4f4;padding:8px 0}input,select,button{font:inherit;padding:8px;margin:3px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.card{background:white;padding:12px;overflow-wrap:anywhere}.card img{height:140px;width:100%;object-fit:contain}.card audio{width:100%}small{display:block;color:#555}</style>
<h1>Original assets · 3.141</h1><p>Decoded from the supplied APK. Names and scoped Unity IDs are retained. This is an inspection tool.</p>
<header><select id="kind"><option>sprite</option><option>texture</option><option>audio</option></select><input id="query" placeholder="Search original asset name"><button id="prev">Previous</button><button id="next">Next</button><span id="count"></span></header><div id="grid"></div>
<script>
let data=[],page=0;const size=60;const grid=document.getElementById('grid'),kind=document.getElementById('kind'),query=document.getElementById('query');
function render(){let rows=data.filter(x=>x.kind===kind.value&&x.name.toLowerCase().includes(query.value.toLowerCase()));const max=Math.max(0,Math.ceil(rows.length/size)-1);page=Math.min(max,Math.max(0,page));document.getElementById('count').textContent=`${rows.length} assets · page ${page+1}/${max+1}`;grid.replaceChildren();for(const r of rows.slice(page*size,(page+1)*size)){const card=document.createElement('div');card.className='card';const link=document.createElement('a');link.href=r.url;link.target='_blank';const name=document.createElement('strong');name.textContent=r.name;link.append(name);card.append(link);if(r.kind==='audio'){const a=document.createElement('audio');a.src=r.url;a.controls=true;a.preload='none';card.append(a)}else{const i=document.createElement('img');i.src=r.url;i.loading='lazy';i.alt=r.name;card.append(i)}const s=document.createElement('small');s.textContent=`${r.file}:${r.path_id}`;card.append(s);if(r.pivot){const p=document.createElement('small');p.textContent=`pivot ${r.pivot.x}, ${r.pivot.y}`;card.append(p)}grid.append(card)}}
query.oninput=kind.onchange=()=>{page=0;render()};document.getElementById('prev').onclick=()=>{page--;render()};document.getElementById('next').onclick=()=>{page++;render()};fetch('asset-review-index.json').then(r=>r.json()).then(r=>{data=r;render()}).catch(e=>grid.textContent=String(e));
</script>
